[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="Задания/*,preview.png,preview.avi,qa_screens/*,tools/*,build/*,docs/*,YANDEX_FIELDS.json,assets/audio/*,assets/models/_selection/*,assets/models/_frame_source/*,assets/models/kenney_furniture-kit.zip,assets/models/bathtub.glb,assets/models/shower.glb,assets/models/toilet.glb,assets/models/trashcan.glb,assets/models/vanity.glb"
export_path="build/Room1604_Limbo.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release="C:/GodotTemplates/4.7.1.stable/windows_release_x86_64.exe"
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="Задания/*,preview.png,preview.avi,qa_screens/*,tools/*,build/*,docs/*,YANDEX_FIELDS.json,assets/audio/*,assets/models/_selection/*,assets/models/_frame_source/*,assets/models/kenney_furniture-kit.zip,assets/models/bathtub.glb,assets/models/shower.glb,assets/models/toilet.glb,assets/models/trashcan.glb,assets/models/vanity.glb"
export_path="build/web/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
# Потоки выключены осознанно: SharedArrayBuffer требует заголовков COOP/COEP,
# которых хостинг Яндекс Игр не отдаёт, и сборка с потоками там просто не
# запустится. Godot для этого держит отдельный шаблон web_nothreads_release.
variant/thread_support=false
# Для веба нужен etc2/astc: s3tc есть только у настольных GPU.
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true
html/export_icon=true
html/canvas_resize_policy=2
progressive_web_app/enabled=false
# html/head_include здесь НЕТ намеренно, и это не забывчивость.
#
# В Godot этот параметр не применяется при экспорте из командной строки:
# плейсхолдер $GODOT_HEAD_INCLUDE остаётся в шаблоне необработанным, и опция
# работает только при экспорте из редактора. Вся наша сборка идёт через CLI,
# поэтому тег SDK Яндекса и правила страницы вставляются отдельным шагом —
# tools/export_web.ps1, сразу после экспорта, с проверкой результата поиском
# по собранному index.html.
#
# Проверено вживую: с head_include в этом файле собранная страница выходила
# без SDK вообще, и заметить это можно было только заглянув в index.html.
